[project]
name = "team-churn-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akwasi Agyekum Wireko", email = "160536609+akwasi-wireko@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "ucimlrepo>=0.0.7",
    "uvicorn>=0.54.0",
]

[project.scripts]
team-churn-api = "team_churn_api:main"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]